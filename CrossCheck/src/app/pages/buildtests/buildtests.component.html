<div style="margin:10px;">
    <h6 style="text-align: center;">
        Build Tests
    </h6>
    <div class="button-container">
        <div>
            <mat-form-field color="primary">
                <mat-label>Select a Story</mat-label>
                <mat-select [(ngModel)]="selectedValue" (selectionChange)="filterTable()" placeholder="All">
                    <mat-option *ngFor="let option of options" [value]="option">
                        <!-- {{ option.viewValue }} -->
                        {{ option }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <div>
            <!-- <input type="file" #fileInput (change)="onFileSelected($event)">
            <button mat-raised-button color="primary" (click)="fileInput.click()">
                <mat-icon>attach_file</mat-icon>
                Select File
            </button> -->
            <!-- app.component.html -->

            <mat-form-field class="custom-height">
                <!-- <mat-label>Upload File</mat-label> -->
                <input matInput type="text" [value]="fileName" readonly (click)="fileInput.click()">
                <button mat-icon-button matSuffix (click)="fileInput.click()">
                    <mat-icon>search</mat-icon>
                </button>
            </mat-form-field>
            <input type="file" #fileInput style="display: none;" (change)="onFileSelected($event)">

            <input type="file" #fileInput style="display: none;" (change)="onFileSelected($event)">
            <button mat-raised-button color="primary" (click)="discoverTests()" style="margin-left: 10px;">
                <!-- <mat-icon matTooltip="Discover Tests">explore</mat-icon> -->
                Discover Tests
            </button>
        </div>
        <div>
            <button mat-icon-button color="primary" (click)="addRow()">
                <mat-icon matTooltip="Create Testprofile">add_circle</mat-icon>
            </button>

            <button mat-icon-button color="primary">
                <mat-icon matTooltip="Delete Tests">delete_circle</mat-icon>
            </button>

            <button mat-icon-button color="primary">
                <mat-icon>more_vert_circle</mat-icon>
            </button>
        </div>
    </div>
    <!-- <button mat-raised-button color="primary">Discover Tests</button> -->
</div>
<div class="table-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <!-- Checkbox Column -->
        <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef class="sticky-header">
                <mat-checkbox (change)="$event ? masterToggle() : null" [checked]="isAllSelected()"
                    [indeterminate]="selection.hasValue() && !isAllSelected()">
                </mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let row">
                <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
                    [checked]="selection.isSelected(row)">
                </mat-checkbox>
            </td>
        </ng-container>

        <!-- Position Column -->
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef class="sticky-header"> No. </th>
            <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef class="sticky-header"> Name </th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="suite">
            <th mat-header-cell *matHeaderCellDef class="sticky-header"> Suite </th>
            <td mat-cell *matCellDef="let element"> {{element.suite}} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="module">
            <th mat-header-cell *matHeaderCellDef class="sticky-header"> Module </th>
            <td mat-cell *matCellDef="let element"> {{element.module}} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef class="sticky-header"> description </th>
            <td mat-cell *matCellDef="let element"> {{element.description}} </td>
        </ng-container>

        <!-- Weight Column -->
        <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef class="sticky-header"> Type </th>
            <td mat-cell *matCellDef="let element"> {{element.type}} </td>
        </ng-container>

        <!-- Symbol Column -->
        <ng-container matColumnDef="testprofile">
            <th mat-header-cell *matHeaderCellDef class="sticky-header"> Test Profile </th>
            <td mat-cell *matCellDef="let element"> {{element.testProfile}} </td>
        </ng-container>

        <!-- Symbol Column -->
        <!-- <ng-container matColumnDef="scriptName">
            <th mat-header-cell *matHeaderCellDef class="sticky-header"> Script Name </th>
            <td mat-cell *matCellDef="let element"> {{element.scriptName}} </td>
        </ng-container> -->

        <!-- Symbol Column -->
        <!-- <ng-container matColumnDef="testProfile">
            <th mat-header-cell *matHeaderCellDef class="sticky-header"> Test Profile</th>
            <td mat-cell *matCellDef="let element"> {{element.testProfile}} </td>
        </ng-container> -->

        <!-- Execute Button Column -->
        <ng-container matColumnDef="execute">
            <th mat-header-cell *matHeaderCellDef class="sticky-header">Execute</th>
            <td mat-cell *matCellDef="let element">
                <button mat-icon-button color="blue" (click)="executeRow(element)">
                    <mat-icon>play_arrow</mat-icon>
                </button>
            </td>
        </ng-container>


        <!-- Delete Button Column -->
        <ng-container matColumnDef="delete">
            <th mat-header-cell *matHeaderCellDef class="sticky-header">Delete</th>
            <td mat-cell *matCellDef="let element">
                <button mat-icon-button (click)="deleteRow(element)">
                    <mat-icon color="primary">delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <!-- Delete Button Column -->
        <ng-container matColumnDef="details">
            <th mat-header-cell *matHeaderCellDef class="sticky-header">Details</th>
            <td mat-cell *matCellDef="let element">
                <button mat-icon-button (click)="displayTest(element)">
                    <!-- <mat-icon color="primary">greater_than</mat-icon> -->
                    <mat-icon color="primary">keyboard_arrow_right</mat-icon>

                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
