<div class="content-container">
    <div>
        <mat-toolbar class="mat-elevation-z3">
            <div style="display: flex;">
                <button mat-icon-button (click)="collapsed.set(!collapsed())">
                    <mat-icon>
                        menu
                    </mat-icon>
                </button>
                <h1 style="padding-top: 5px ;padding-left: 10px ;">MM Cross Check</h1>
            </div>
            <button mat-icon-button class="notify-icon">
                <mat-icon>
                    notifications_none
                </mat-icon>
            </button>
            <button mat-icon-button class="account-icon" #openButton (click)="openAccountDialog()">
                <mat-icon>
                    account_circle
                </mat-icon>
            </button>
        </mat-toolbar>
    </div>  
    <!-- <div > -->
        <mat-sidenav-container class="matsidenav-container sticky-header">
            <mat-sidenav opened mode="side" [style.width]="sidenavWidth()">
                <!-- <app-file-explorer></app-file-explorer> -->
                <app-file-explorer1 [collapsed]="collapsed()"></app-file-explorer1>
                <!-- <app-custom-sidenav [collapsed]="collapsed()"></app-custom-sidenav> -->
            </mat-sidenav>
            <mat-sidenav-content class="content" [style.margin-left]="sidenavWidth()">
                <div class="header-container" class="sticky-header">

                    <div class="button-container">
                        <div>
                            <button mat-icon-button color="primary" (click)="goHome()">
                                <mat-icon matTooltip="Go Home">home</mat-icon>
                            </button>
                            <button mat-icon-button color="primary" (click)="refreshTable()">
                                <mat-icon matTooltip="Refresh Table">refresh</mat-icon>
                            </button>
                        </div>
                        <p style="text-align: center; margin-top: 5px;">
                            Development Studio
                        </p>

                        <div>
                            <button mat-icon-button color="primary" (click)="addRow()">
                                <mat-icon matTooltip="Update Personalized List">settings</mat-icon>
                            </button>
                            <button mat-icon-button color="primary" (click)="addRow()">
                                <mat-icon matTooltip="Create Testprofile">add_circle</mat-icon>
                            </button>

                            <button mat-icon-button color="primary">
                                <mat-icon matTooltip="Delete Tests">delete_circle</mat-icon>
                            </button>

                            <button mat-icon-button color="primary">
                                <mat-icon matTooltip="More Options">more_vert_circle</mat-icon>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- <div > -->
                <div class="table-container" style="display:flex;">
                    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

                        <!-- Checkbox Column -->
                        <ng-container matColumnDef="select" style="display:flex;">
                            <th mat-header-cell *matHeaderCellDef class="sticky-header narrow-column">
                                <mat-checkbox (change)="$event ? masterToggle() : null" [checked]="isAllSelected()"
                                    [indeterminate]="selection.hasValue() && !isAllSelected()">
                                </mat-checkbox>
                            </th>
                            <td mat-cell *matCellDef="let row">
                                <mat-checkbox (click)="$event.stopPropagation()"
                                    (change)="$event ? selection.toggle(row) : null"
                                    [checked]="selection.isSelected(row)">
                                </mat-checkbox>
                            </td>
                        </ng-container>

                        <!-- Testcase Number Column -->
                        <ng-container matColumnDef="search">
                            <th mat-header-cell *matHeaderCellDef class="sticky-header narrow-column">
                                <button mat-icon-button color="primary">
                                    <mat-icon>search</mat-icon>
                                </button>
                            </th>
                            <td mat-cell *matCellDef="let element"></td>
                        </ng-container>

                        <!-- Testcase Number Column -->
                        <ng-container matColumnDef="id">
                            <th mat-header-cell *matHeaderCellDef class="sticky-header"> No. </th>
                            <td mat-cell *matCellDef="let element"> {{element.id}} </td>
                        </ng-container>

                        <!-- Name Column -->
                        <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef class="sticky-header"> Name </th>
                            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                        </ng-container>

                        <!-- Name Column -->
                        <ng-container matColumnDef="suite">
                            <th mat-header-cell *matHeaderCellDef class="sticky-header"> Suite </th>
                            <td mat-cell *matCellDef="let element"> {{element.suite}} </td>
                        </ng-container>

                        <!-- Name Column -->
                        <ng-container matColumnDef="module">
                            <th mat-header-cell *matHeaderCellDef class="sticky-header"> Module </th>
                            <td mat-cell *matCellDef="let element"> {{element.module}} </td>
                        </ng-container>

                        <!-- Name Column -->
                        <ng-container matColumnDef="description">
                            <th mat-header-cell *matHeaderCellDef class="sticky-header"> description </th>
                            <td mat-cell *matCellDef="let element"> {{element.description}} </td>
                        </ng-container>

                        <!-- Weight Column -->
                        <ng-container matColumnDef="type">
                            <th mat-header-cell *matHeaderCellDef class="sticky-header"> Type </th>
                            <td mat-cell *matCellDef="let element"> {{element.type}} </td>
                        </ng-container>

                        <!-- Symbol Column -->
                        <ng-container matColumnDef="testprofile">
                            <th mat-header-cell *matHeaderCellDef class="sticky-header"> Test Profile </th>
                            <td mat-cell *matCellDef="let element"> {{element.testprofile}} </td>
                        </ng-container>

                        <!-- Execute Button Column -->
                        <ng-container matColumnDef="execute">
                            <th mat-header-cell *matHeaderCellDef class="sticky-header">Execute</th>
                            <td mat-cell *matCellDef="let element">
                                <button mat-icon-button color="blue" (click)="executeRow(element)">
                                    <mat-icon>play_arrow</mat-icon>
                                </button>
                            </td>
                        </ng-container>


                        <!-- Delete Button Column -->
                        <ng-container matColumnDef="delete">
                            <th mat-header-cell *matHeaderCellDef class="sticky-header">Delete</th>
                            <td mat-cell *matCellDef="let element">
                                <button mat-icon-button (click)="deleteRow(element)">
                                    <mat-icon color="primary">delete</mat-icon>
                                </button>
                            </td>
                        </ng-container>

                        <!-- Delete Button Column -->
                        <ng-container matColumnDef="details">
                            <th mat-header-cell *matHeaderCellDef class="sticky-header">Details</th>
                            <td mat-cell *matCellDef="let element">
                                <button mat-icon-button (click)="displayTest(element)">
                                    <!-- <mat-icon color="primary">greater_than</mat-icon> -->
                                    <mat-icon color="primary">keyboard_arrow_right</mat-icon>

                                </button>
                            </td>
                        </ng-container>
                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>
                </div>
                <div class="paginator-container">
                    <!-- Add Paginator -->
                    <mat-paginator class="paginator" [length]="dataSource.data.length" [pageSize]="5"
                        [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons (page)="pageEvent = $event">
                    </mat-paginator>
                </div>
                <!-- </div> -->
            </mat-sidenav-content>
        </mat-sidenav-container>
    <!-- </div> -->
</div>
