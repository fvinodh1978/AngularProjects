<div style="align-items: center; border-radius: 4px">
    <!-- <mat-progress-spinner *ngIf="isLoading" mode="indeterminate"></mat-progress-spinner> -->
    <h1 mat-dialog-title style="font-size:medium; padding-bottom: 0px; margin-bottom: 0px; text-align: center;">Discovery Details</h1>

    <div mat-dialog-content>
        
     <table mat-table [dataSource]="dataSource">
        <!-- class="mat-elevation-z8">  -->

            <!-- Column 1 -->
            <ng-container matColumnDef="module">
                <th mat-header-cell *matHeaderCellDef class="sticky-header"> Module Name </th>
                <td mat-cell *matCellDef="let element"> {{element.module}} </td>
            </ng-container>

            <!-- Column 2 -->
            <ng-container matColumnDef="suite">
                <th mat-header-cell *matHeaderCellDef class="sticky-header"> Suite Name </th>
                <td mat-cell *matCellDef="let element"> {{element.suite}} </td>
            </ng-container>

                        <!-- Column 2 -->
                        <ng-container matColumnDef="count">
                            <th mat-header-cell *matHeaderCellDef class="sticky-header"> Count </th>
                            <td mat-cell *matCellDef="let element"> {{element.count}} </td>
                        </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
    <div mat-dialog-actions>
        <button mat-button (click)="onClose()">Close</button>
    </div>
</div>
